#! api-deployment.yaml
# Generated code, do not edit
apiVersion: apps/v1
kind: Deployment
metadata:
    name: api
    namespace: crediucc
    labels:
        com.docker.compose.project: crediucc
        com.docker.compose.service: api
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: crediucc
            com.docker.compose.service: api
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: crediucc
                com.docker.compose.service: api
                com.docker.compose.network.default: "true"
        spec:
            containers:
                - name: crediucc-api
                  image: crediucc-api:1.0.0
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: APP_HEALTHY
                      value: "true"
                    - name: APP_VERSION
                      value: "1.0.0"
                    - name: AWS_ACCESS_KEY_ID
                      value: "test"
                    - name: AWS_DEFAULT_REGION
                      value: "us-east-1"
                    - name: AWS_ENDPOINT_URL
                      value: "http://localstack:4566"
                    - name: AWS_SECRET_ACCESS_KEY
                      value: "test"
                    - name: CENTRAL_RIESGO_LATENCIA_MS
                      value: "150"
                    - name: CLOUD_ENABLED
                      value: "true"
                  livenessProbe:
                    exec:
                        command: ['curl -f http://localhost:8000/health']
                    periodSeconds: 5
                    timeoutSeconds: 3
                    failureThreshold: 5
                  ports:
                    - name: api-8000
                      containerPort: 8000
