# Semana 7: configuración de SonarCloud.
sonar.organization=estebanMns
sonar.projectKey=estebanMns_crediucc
sonar.projectName=CrediUCC

sonar.sources=app,infra,deploy,load,frontend/src
sonar.tests=tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=frontend/node_modules/**,frontend/.next/**,frontend/coverage/**

# El job falla si el Quality Gate de SonarCloud no pasa.
sonar.qualitygate.wait=true
