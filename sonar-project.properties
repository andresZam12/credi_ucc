# Semana 7: configuración de SonarCloud.
sonar.organization=andreszam12
sonar.projectKey=andresZam12_credi_ucc
sonar.projectName=CrediUCC

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.exclusions=frontend/node_modules/**,frontend/.next/**,frontend/coverage/**,frontend/next.config.ts,frontend/eslint.config.mjs,frontend/src/app/layout.tsx,frontend/src/**/*.test.tsx,frontend/src/**/*.test.ts

# El job falla si el Quality Gate de SonarCloud no pasa.
sonar.qualitygate.wait=true
