# Semana 7: configuración de SonarCloud. Cambia organization y projectKey por los tuyos.
sonar.organization=tu-organizacion
sonar.projectKey=tu-organizacion_crediucc
sonar.projectName=CrediUCC

sonar.sources=app,infra,deploy,load
sonar.tests=tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# El job falla si el Quality Gate de SonarCloud no pasa.
sonar.qualitygate.wait=true
